name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# These are public, local-only defaults. Browser E2E replaces them with values
# emitted by the isolated Supabase instance started inside the GitHub runner.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_only
  SUPABASE_SECRET_KEY: sb_secret_ci_only
  SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_only
  RAPOR_ACCESS_CODE_PEPPER: ci-only-pepper-not-used-for-production-data

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify shared identity contract
        run: bun run test:contract

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit and component tests
        run: bun run test

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build Next.js
        run: bun run build

      - name: Verify build output
        run: test -f .next/BUILD_ID

  e2e:
    name: Isolated E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_PH_EMAIL: e2e.ph@localhost.invalid
      E2E_PH_PASSWORD: CI-only-password-2026-PH
      E2E_SENDER_EMAIL: e2e.sender@localhost.invalid
      E2E_SENDER_PASSWORD: CI-only-password-2026-MEMBER
      E2E_HR_EMAIL: e2e.hr@localhost.invalid
      E2E_HR_PASSWORD: CI-only-password-2026-HR
      E2E_REPORT_ID: 00000000-0000-4000-8000-000000000101
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start isolated Supabase
        run: npx --yes supabase@2.113.0 start

      - name: Export isolated Supabase configuration
        shell: bash
        run: |
          npx --yes supabase@2.113.0 status -o env > supabase-status.env

          read_value() {
            grep -E "^$1=" supabase-status.env | tail -n 1 | cut -d= -f2- | sed 's/^"//; s/"$//'
          }

          api_url="$(read_value API_URL)"
          publishable_key="$(read_value PUBLISHABLE_KEY)"
          anon_key="$(read_value ANON_KEY)"
          secret_key="$(read_value SECRET_KEY)"
          service_role_key="$(read_value SERVICE_ROLE_KEY)"

          if [ "$api_url" != "http://127.0.0.1:55321" ]; then
            echo "::error::Refusing non-local E2E target: $api_url"
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_SECRET_KEY=$secret_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
          } >> "$GITHUB_ENV"

      - name: Apply schema-only fixtures
        shell: bash
        run: |
          docker exec -i supabase_db_halo-psdm-ci psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/e2e/database/shared-schema.sql
          docker exec -i supabase_db_halo-psdm-ci psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/08_chat_history_retention_and_audit.sql

      - name: Seed CI-only accounts and records
        run: node tests/e2e/seed-local-supabase.mjs

      - name: Build against isolated Supabase
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E
        run: bunx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop isolated Supabase
        if: ${{ always() }}
        run: npx --yes supabase@2.113.0 stop --no-backup

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Block critical dependency advisories
        run: bun audit --audit-level critical

      - name: Report high dependency advisories
        shell: bash
        run: |
          if ! bun audit --audit-level high; then
            echo "::warning::High advisories remain in development-only transitive tooling; critical advisories are still blocked."
          fi
